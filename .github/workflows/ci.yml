name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          version: "0.5.11"
      - run: uv sync --frozen --extra dev
      - name: ruff (lint)
        run: uv run ruff check .
      - name: ruff (format)
        run: uv run ruff format --check .
      - name: mypy --strict
        run: uv run mypy
      - name: import-linter
        run: uv run lint-imports

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          version: "0.5.11"
      - run: uv sync --frozen --extra dev
      - name: unit + api + architecture + e2e tests (global coverage >= 90%)
        run: >
          uv run pytest -m "not integration"
          --cov-fail-under=90
          --cov-report=xml
      - name: e2e suite in isolation (real transport + real SQLite)
        run: uv run pytest -m e2e -o addopts="" -q
      - name: domain coverage gate (>= 95%)
        run: >
          uv run pytest -m "not integration" tests/domain
          -o addopts=""
          --cov=src/car_insurance/domain --cov-report=term-missing
          --cov-fail-under=95
      - name: persistence integration tests (testcontainers)
        run: uv run pytest -m integration

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: build image
        run: docker build -t car-insurance:ci .
      - name: image is lean and runs as a non-root user
        run: |
          set -e
          SIZE=$(docker image inspect car-insurance:ci --format '{{.Size}}')
          echo "image size: $((SIZE/1024/1024)) MiB"
          test "$SIZE" -lt $((250*1024*1024))  # budget: < 250 MiB
          UID=$(docker run --rm --entrypoint id car-insurance:ci -u)
          test "$UID" != "0"
      - name: smoke test — stateless (contract, health, OpenAPI, error bodies)
        run: |
          set -e
          docker compose up -d --build --wait
          # car_age is pinned to 10 regardless of the year CI runs in, so the
          # expected numbers stay constant: rate 0.10 -> premium 9050, limit 90000.
          YEAR=$(( $(date -u +%Y) - 10 ))
          BODY=$(curl -sS -X POST http://localhost:8000/api/v1/premiums/calculate \
            -H 'content-type: application/json' \
            -d "{\"broker_fee\":50.0,\"car\":{\"make\":\"Toyota\",\"model\":\"Corolla\",\"value\":100000.0,\"year\":$YEAR},\"deductible_percentage\":0.10}")
          echo "$BODY"
          echo "$BODY" | python -c "import json,sys; b=json.load(sys.stdin); assert set(b)=={'applied_rate','calculated_premium','car','deductible_value','policy_limit'}, b; assert float(b['applied_rate'])==0.1, b; assert float(b['calculated_premium'])==9050.0, b; assert float(b['policy_limit'])==90000.0, b; print('stateless smoke ok')"
          # liveness always 200; readiness 200 with persistence off
          curl -sS -f http://localhost:8000/health/live -o /dev/null
          curl -sS -f http://localhost:8000/health/ready -o /dev/null
          # the served OpenAPI is valid and documents 200/422/500/503 + Swagger UIs render
          curl -sS http://localhost:8000/openapi.json | python -c "import json,sys; s=json.load(sys.stdin); r=s['paths']['/api/v1/premiums/calculate']['post']['responses']; assert {'200','422','500','503'} <= set(r), r; assert s['paths']['/api/v1/premiums/calculate']['post']['operationId']=='calculatePremium'; print('openapi ok')"
          curl -sS -f http://localhost:8000/docs -o /dev/null
          curl -sS -f http://localhost:8000/redoc -o /dev/null
          # unknown history id -> 404 (persistence off)
          test "$(curl -sS -o /dev/null -w '%{http_code}' http://localhost:8000/api/v1/premiums/00000000-0000-0000-0000-000000000000)" = 404
          # a huge value is rejected at the schema, never a 500; body is {loc,msg,type}
          ERR=$(curl -sS -X POST http://localhost:8000/api/v1/premiums/calculate -H 'content-type: application/json' -d '{"broker_fee":0,"car":{"make":"X","model":"Y","value":1e30,"year":2000},"deductible_percentage":0.1}')
          echo "$ERR" | python -c "import json,sys; b=json.load(sys.stdin); assert all(set(i)=={'loc','msg','type'} for i in b['detail']), b; print('error-body shape ok')"
          # a future model year is a domain 422 (not a 500), same body shape
          FUT=$(( $(date -u +%Y) + 5 ))
          test "$(curl -sS -o /dev/null -w '%{http_code}' -X POST http://localhost:8000/api/v1/premiums/calculate -H 'content-type: application/json' -d "{\"broker_fee\":0,\"car\":{\"make\":\"X\",\"model\":\"Y\",\"value\":10000,\"year\":$FUT},\"deductible_percentage\":0.1}")" = 422
          docker compose down -v
      - name: smoke test — GIS fail-closed returns 503 (never 500)
        run: |
          set -e
          GIS_ENABLED=true GIS_BASE_URL=http://127.0.0.1:9 GIS_FAILURE_MODE=fail_closed \
            GIS_TIMEOUT_SECONDS=1 docker compose up -d --build --wait
          YEAR=$(( $(date -u +%Y) - 10 ))
          test "$(curl -sS -o /dev/null -w '%{http_code}' -X POST http://localhost:8000/api/v1/premiums/calculate -H 'content-type: application/json' -d "{\"broker_fee\":50.0,\"car\":{\"make\":\"T\",\"model\":\"C\",\"value\":100000.0,\"year\":$YEAR},\"deductible_percentage\":0.10,\"registration_location\":{\"country\":\"US\"}}")" = 503
          docker compose down -v
      - name: smoke test — persistence ON (entrypoint runs alembic, history round-trips)
        run: |
          set -e
          PERSISTENCE_ENABLED=true docker compose up -d --build --wait
          YEAR=$(( $(date -u +%Y) - 14 ))
          curl -sS -X POST http://localhost:8000/api/v1/premiums/calculate \
            -H 'content-type: application/json' \
            -d "{\"broker_fee\":50.0,\"car\":{\"make\":\"Toyota\",\"model\":\"Corolla\",\"value\":100000.0,\"year\":$YEAR},\"deductible_percentage\":0.10}" -o /dev/null
          PAGE=$(curl -sS http://localhost:8000/api/v1/premiums)
          ID=$(echo "$PAGE" | python -c "import json,sys; print(json.load(sys.stdin)['items'][0]['simulation_id'])")
          echo "persisted simulation: $ID"
          curl -sS "http://localhost:8000/api/v1/premiums/$ID" | python -c "import json,sys; b=json.load(sys.stdin); assert float(b['calculated_premium'])==10850.0, b; assert b['rules_version']=='2026.08.0', b; assert set(b['car'])=={'make','model','value','year'}, b; print('persistence smoke ok')"
          curl -sS -f http://localhost:8000/health/ready -o /dev/null
      - name: compose logs on failure
        if: failure()
        run: docker compose logs
      - name: teardown
        if: always()
        run: PERSISTENCE_ENABLED=true docker compose down -v
