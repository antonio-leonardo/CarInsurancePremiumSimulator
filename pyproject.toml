[project]
name = "car-insurance"
version = "2026.08.0"
description = "Car Insurance Premium Simulator — DDD / Clean Architecture backend"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "MIT" }
authors = [{ name = "Antonio Freire", email = "antonio.leonardo@outlook.com.br" }]
dependencies = [
    "alembic>=1.13",
    "fastapi>=0.111",
    "httpx>=0.27",
    "psycopg[binary]>=3.1",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "sqlalchemy>=2.0",
    "structlog>=24.1",
    "uvicorn[standard]>=0.30",
]

[project.optional-dependencies]
dev = [
    "hypothesis>=6.100",
    "import-linter>=2.0",
    "mypy>=1.10",
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "testcontainers[postgres]>=4.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/car_insurance"]

[tool.uv]
package = true

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "A", "C4", "SIM", "RUF"]
ignore = ["A003"]

[tool.ruff.lint.isort]
known-first-party = ["car_insurance", "tests"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
packages = ["car_insurance"]
plugins = ["pydantic.mypy"]
warn_unreachable = true

[[tool.mypy.overrides]]
module = ["testcontainers.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
addopts = "--cov=src/car_insurance --cov-report=term-missing --cov-branch --strict-markers"
testpaths = ["tests"]
markers = [
    "integration: tests that require external services (PostgreSQL via testcontainers)",
]
filterwarnings = [
    "error",
    # Starlette 1.6 nudges towards the unreleased `httpx2`; the pinned stack uses httpx.
    "ignore:Using `httpx` with `starlette.testclient`:Warning",
]

[tool.coverage.run]
branch = true
source = ["src/car_insurance"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "\\.\\.\\.",
]

[tool.importlinter]
root_package = "car_insurance"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Clean Architecture layers"
type = "layers"
layers = [
    "car_insurance.presentation",
    "car_insurance.infrastructure",
    "car_insurance.application",
    "car_insurance.domain",
]

[[tool.importlinter.contracts]]
name = "domain and application are framework-free"
type = "forbidden"
source_modules = [
    "car_insurance.domain",
    "car_insurance.application",
]
forbidden_modules = [
    "fastapi",
    "httpx",
    "pydantic",
    "sqlalchemy",
    "structlog",
]
